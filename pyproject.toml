[project]
name = "pam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "emoji>=2.14.0",
    "ipython>=9.0.0",
    "matplotlib-inline>=0.1.7",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "seaborn>=0.13.0",
    "dotenv>=0.9.9",
    "instagrapi>=2.2.1",
    "instaloader>=4.15",
    "pandas>=3.0.0",
    "playwright>=1.58.0",
    "selenium>=4.40.0",
    "webdriver-manager>=4.0.2",
    "langdetect>=1.0.9",
    "pydantic-ai>=1.60.0",
    "python-dotenv>=1.2.1",
    "nest-asyncio>=1.6.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = ["ruff>=0.9.0"]
