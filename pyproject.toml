[project]
name = "brazilian-digital-identity-paper"
version = "1.0.0"
description = "Thematic corpus and LLM-assisted pipeline for Brazilian digital identity on Instagram (17,287 anonymized comments)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Étore Braga e Santos", email = "etore.bes@gallify.dev" },
    { name = "Pâmella Fernandes de Sá" },
]
maintainers = [
    { name = "Étore Braga e Santos", email = "etore.bes@gallify.dev" },
]
keywords = ["brazilian-identity", "social-identity-theory", "netnography", "instagram", "content-analysis", "llm-annotation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Etore-BeS/brazilian-digital-identity-paper"
Dataset = "https://huggingface.co/datasets/Etore-BeS/brazilian-digital-identity-instagram-corpus"
"Bug Tracker" = "https://github.com/Etore-BeS/brazilian-digital-identity-paper/issues"
dependencies = [
    "emoji>=2.14.0",
    "ipython>=9.0.0",
    "matplotlib-inline>=0.1.7",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "seaborn>=0.13.0",
    "dotenv>=0.9.9",
    "instagrapi>=2.2.1",
    "instaloader>=4.15",
    "pandas>=3.0.0",
    "playwright>=1.58.0",
    "selenium>=4.40.0",
    "webdriver-manager>=4.0.2",
    "langdetect>=1.0.9",
    "pydantic-ai>=1.60.0",
    "python-dotenv>=1.2.1",
    "nest-asyncio>=1.6.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_nb.py" = ["E501"]
"scripts/playwright_scraper.py" = ["E501", "F821", "I001", "UP015"]

[dependency-groups]
dev = ["ruff>=0.9.0"]
